<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

    <title>Careers at MacArtney — Join us to connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="page-grid">
    <a href="#main" class="skip-link">Skip to main content</a>

        <button

          <ul class="main-nav__list">

                aria-controls="work-menu"

              <ul

                hidden
              >
                <li>
                  <a class="main-nav__submenu-link" href="sales.html">Sales</a>
                </li>
                <li>
                  <a class="main-nav__submenu-link" href="engineering.html">

                  </a>
                </li>
                <li>
                  <a class="main-nav__submenu-link" href="workshop.html">
                    Workshop
                  </a>
                </li>
                <li>
                  <a
                    class="main-nav__submenu-link"
                    href="business-support.html"

                    Business Support
                  </a>
                </li>
              </ul>
            </li>
            <li class="main-nav__item">
              <a class="main-nav__link" href="locations.html">Locations</a>
            </li>
            <li class="main-nav__item">
              <a class="main-nav__link" href="sustainability.html">
                Sustainability
              </a>
            </li>
          </ul>
          <div class="nav-cta">
            <a class="btn btn-space btn--primary btn--md" href="search.html">
              <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="22" y2="22"/>
              </svg>
              Jobs
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main">
      <section class="home-hero" aria-labelledby="hero-title">
        <div class="container home-hero__inner">
          <div class="home-hero__text-area">
            <span class="hero__eyebrow">MacArtney Careers</span>
            <h1 class="home-hero__title" id="hero-title">
              Join us to <span class="home-hero__title-accent">connect</span>
            </h1>
            <p class="home-hero__subtitle">
              There's a place here for every kind of expertise.
            </p>
            <div class="home-hero__actions">
              <a class="btn btn-space btn--primary" href="search.html"
                >Explore Roles</a
              >
            </div>
          </div>
        </div>

    <script type="module" src="js/core/buttons.js"></script>
